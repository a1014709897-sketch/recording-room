<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafafa">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src https://framecho-share-1455997977.cos.ap-guangzhou.myqcloud.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>录屏</title>
  <link rel="stylesheet" href="./style.css?v=3">
  <script src="./player.js?v=3" defer></script>
</head>
<body>
  <main id="viewer">
    <div id="stage" class="stage" aria-label="录屏播放器">
      <video id="video" preload="auto" playsinline hidden></video>
      <button id="play" type="button" aria-label="播放录屏" hidden><i aria-hidden="true"></i></button>
      <div id="state" role="status">
        <strong id="status">请打开完整的录屏链接</strong>
        <span id="message"></span>
        <button id="retry" type="button" hidden>重新加载</button>
      </div>
    </div>
    <div id="info" class="info" hidden>
      <div id="timestamp" hidden><time id="recorded" aria-label="录制时间"></time><span class="zone">北京时间</span></div>
      <button id="share" type="button" aria-label="复制分享链接">复制链接</button>
    </div>
  </main>
</body>
</html>
