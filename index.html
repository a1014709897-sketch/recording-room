<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#222325" media="(prefers-color-scheme: dark)">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src https://framecho-share-1455997977.cos.ap-guangzhou.myqcloud.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>录屏</title>
  <link rel="stylesheet" href="./style.css?v=7">
  <script src="./player.js?v=7" defer></script>
</head>
<body>
  <main id="viewer">
    <header id="info" hidden>
      <div>
        <div class="title-line"><h1 id="title">屏幕录像</h1><button id="rename" type="button">改标题</button></div>
        <div class="byline"><span class="author"><img src="./avatar.jpg" alt="" width="28" height="28">jiejie</span><div id="timestamp" hidden><time id="recorded" aria-label="录制时间"></time> 北京时间</div></div>
      </div>
      <button id="share" type="button" aria-label="复制名称、日期和录屏链接"><i aria-hidden="true"></i><span id="shareLabel" role="status">复制链接</span></button>
    </header>
    <div id="stage" class="stage" aria-label="录屏播放器">
      <video id="video" preload="auto" playsinline hidden></video>
      <button id="play" type="button" aria-label="播放录屏" hidden><i aria-hidden="true"></i></button>
      <div id="state" role="status">
        <strong id="status">请打开完整的录屏链接</strong>
        <span id="message"></span>
        <button id="retry" type="button" hidden>重新加载</button>
      </div>
    </div>
  </main>
  <dialog id="nameDialog">
    <form id="nameForm">
      <label for="nameInput">分享标题</label>
      <input id="nameInput" maxlength="256" required autocomplete="off">
      <small>保存后，复制新链接发给对方。</small>
      <div class="name-actions"><button type="button" id="cancelName">取消</button><button type="submit">保存</button></div>
    </form>
  </dialog>
</body>
</html>
